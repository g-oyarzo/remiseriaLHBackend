; Pool de PHP-FPM. Valores para la VM Always Free (2 OCPU / 12 GB): con
; ~40 MB por proceso, 24 procesos usan menos de 1 GB. Ajustar
; pm.max_children según las pruebas de carga (deploy/carga/README.md).
[www]
listen = 9000
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 35s

ping.path = /fpm-ping
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
